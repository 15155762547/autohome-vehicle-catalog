[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autohome-vehicle-catalog"
version = "0.1.0"
description = "Source-faithful Autohome vehicle catalog with Scrapy and Pydantic"
requires-python = ">=3.12"
dependencies = ["scrapy>=2.14,<3", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
autohome-catalog = "autohome_catalog.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/autohome_catalog"]

[tool.hatch.build.targets.wheel.force-include]
"schema/fields.json" = "autohome_catalog/fields.json"
